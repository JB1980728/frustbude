name = "frustbude"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "frustbude-db"
database_id = "932bc6cc-458e-4085-b3bc-9cc42677c333"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
